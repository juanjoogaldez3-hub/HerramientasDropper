# Dropper · Supabase (proyecto que ya corre los reportes)
project_id = "uroqcxlwdzkjmkrpjmxf"

# El webhook de WhatsApp es público (Meta lo llama sin sesión de usuario).
# Verificamos la firma de Meta DENTRO de la función.
[functions.whatsapp-webhook]
verify_jwt = false

# El envío desde la bandeja verifica el JWT del usuario MANUALMENTE dentro de la
# función (así podemos responder bien el preflight CORS del navegador).
[functions.whatsapp-send]
verify_jwt = false

# Sincronizador de Temu con CPS. Verifica DENTRO de la función el JWT del usuario
# (botón de la página) o el secreto de la tarea automática (header x-temu-cron).
[functions.temu-sync]
verify_jwt = false
